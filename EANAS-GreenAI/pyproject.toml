[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "eanas-greenai"
version = "0.1.0"
description = "Energy-aware hybrid reinforcement learning and evolutionary neural architecture search"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "scipy>=1.11", "PyYAML>=6", "matplotlib>=3.7"]
[tool.setuptools.packages.find]
where = ["src"]
